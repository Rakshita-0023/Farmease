name: AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply Terraform after plan (requires protected environment approval)
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: aws-production
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # This is intentionally separate from the least-privilege image/ECS
          # deployment role. Terraform needs a protected provisioning role.
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
          role-session-name: farmease-terraform
      - name: Initialize remote state
        run: terraform -chdir=infra/aws init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=farmease/production.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'ap-south-1' }}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws validate
      - name: Plan
        env:
          TF_VAR_core_image: ${{ vars.CORE_IMAGE }}
          TF_VAR_ml_image: ${{ vars.ML_IMAGE }}
          TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
        run: terraform -chdir=infra/aws plan -out=tfplan
      - name: Apply approved plan
        if: ${{ inputs.apply == true }}
        env:
          TF_VAR_core_image: ${{ vars.CORE_IMAGE }}
          TF_VAR_ml_image: ${{ vars.ML_IMAGE }}
          TF_VAR_jwt_secret_arn: ${{ vars.JWT_SECRET_ARN }}
        run: terraform -chdir=infra/aws apply tfplan
