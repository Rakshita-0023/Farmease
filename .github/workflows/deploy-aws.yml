name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'farmease-production' }}
  CORE_SERVICE: ${{ vars.CORE_SERVICE || 'farmease-production-core' }}
  ML_SERVICE: ${{ vars.ML_SERVICE || 'farmease-production-ml' }}
  CORE_TASK_FAMILY: ${{ vars.CORE_TASK_FAMILY || 'farmease-production-core' }}
  ML_TASK_FAMILY: ${{ vars.ML_TASK_FAMILY || 'farmease-production-ml' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-production
    # Keep ordinary repository CI green before the one-time AWS bootstrap is
    # complete. Once the protected role is configured, every main push deploys
    # and the smoke test remains fail-closed.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run openapi:validate
        working-directory: backend

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: ml-service
      - run: FARMEASE_SKIP_MODEL_LOADING=true python -m unittest discover -s tests
        working-directory: ml-service

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: farmease-github-deploy
      - uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR repositories
        id: ecr
        run: |
          echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
      - name: Build and push immutable images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --file backend/Dockerfile --tag "$REGISTRY/farmease-core:$IMAGE_TAG" .
          docker build --file ml-service/Dockerfile --tag "$REGISTRY/farmease-ml:$IMAGE_TAG" .
          docker push "$REGISTRY/farmease-core:$IMAGE_TAG"
          docker push "$REGISTRY/farmease-ml:$IMAGE_TAG"

      - name: Register immutable Core task definition
        id: core-task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/farmease-core:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$CORE_TASK_FAMILY" --query taskDefinition > /tmp/core-task.json
          jq --arg image "$IMAGE" '{family,taskRoleArn,executionRoleArn,networkMode,containerDefinitions:(.containerDefinitions|map(if .name=="core" then .image=$image else . end)),volumes,placementConstraints,requiresCompatibilities,cpu,memory,pidMode,ipcMode,proxyConfiguration,ephemeralStorage,runtimePlatform}' /tmp/core-task.json > /tmp/core-register.json
          echo "task_definition=$(aws ecs register-task-definition --cli-input-json file:///tmp/core-register.json --query taskDefinition.taskDefinitionArn --output text)" >> "$GITHUB_OUTPUT"
      - name: Register immutable ML task definition
        id: ml-task
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/farmease-ml:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$ML_TASK_FAMILY" --query taskDefinition > /tmp/ml-task.json
          jq --arg image "$IMAGE" '{family,taskRoleArn,executionRoleArn,networkMode,containerDefinitions:(.containerDefinitions|map(if .name=="ml" then .image=$image else . end)),volumes,placementConstraints,requiresCompatibilities,cpu,memory,pidMode,ipcMode,proxyConfiguration,ephemeralStorage,runtimePlatform}' /tmp/ml-task.json > /tmp/ml-register.json
          echo "task_definition=$(aws ecs register-task-definition --cli-input-json file:///tmp/ml-register.json --query taskDefinition.taskDefinitionArn --output text)" >> "$GITHUB_OUTPUT"
      - name: Update ECS services
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$CORE_SERVICE" --task-definition "${{ steps.core-task.outputs.task_definition }}" >/dev/null
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ML_SERVICE" --task-definition "${{ steps.ml-task.outputs.task_definition }}" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$CORE_SERVICE" "$ML_SERVICE"
      - name: Smoke test deployed Core
        env:
          CORE_URL: ${{ vars.AWS_CORE_URL }}
        run: |
          test -n "$CORE_URL"
          curl --fail --retry 10 --retry-delay 5 --max-time 20 "$CORE_URL/api/v1/health"
