name: Release SDKs
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python -m pip install --upgrade build twine
      - run: python -m build --outdir dist
        working-directory: sdks/python
      - run: python -m twine check sdks/python/dist/*
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: sdks/typescript
      - run: npm test && npm pack --dry-run
        working-directory: sdks/typescript
  publish-python:
    needs: validate
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python -m pip install build
      - run: python -m build --outdir dist
        working-directory: sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: sdks/python/dist/ }
  publish-npm:
    needs: validate
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: 'https://registry.npmjs.org' }
      - run: npm install && npm run build && npm publish --provenance --access public
        working-directory: sdks/typescript
