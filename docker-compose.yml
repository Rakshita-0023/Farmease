services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: farmease
      POSTGRES_USER: farmease
      POSTGRES_PASSWORD: farmease-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmease -d farmease"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - farmease-postgres:/var/lib/postgresql/data

  ml:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    environment:
      PORT: 8000
      FARMEASE_CORS_ORIGINS: http://localhost:5173,http://localhost:5001
      FARMEASE_DOWNLOAD_MODELS: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5001
      JWT_SECRET: local-compose-secret-change-me
      DATABASE_URL: postgresql://farmease:farmease-local-only@postgres:5432/farmease
      CORS_ORIGINS: http://localhost:5173
      ML_API_URL: http://ml:8000
      PLANT_DOCTOR_API_URL: http://ml:8000
      MARKET_DATA_MODE: LIVE
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 10

volumes:
  farmease-postgres:
